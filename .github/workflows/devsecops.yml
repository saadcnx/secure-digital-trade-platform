name: DevSecOps

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install project dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest bandit pip-audit

      - name: Install spaCy English model
        run: uv pip install --system https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Cache trained fraud artifacts
        id: fraud-models-cache
        uses: actions/cache@v4
        with:
          path: |
            fraud_engine/models/xgb_payment_fraud.pkl
            fraud_engine/models/nlp_fake_review.pkl
          key: fraud-models-${{ hashFiles('fraud_engine/generate_data.py', 'fraud_engine/train_fraud_model.py', 'fraud_engine/fake_review_detector.py', 'requirements.txt') }}

      - name: Build synthetic fraud model
        if: steps.fraud-models-cache.outputs.cache-hit != 'true'
        run: |
          python -m fraud_engine.generate_data
          python -m fraud_engine.train_fraud_model
          python -m fraud_engine.fake_review_detector

      - name: Run tests
        run: pytest -q

      - name: Bandit (SAST)
        run: |
          bandit -r \
            fraud_engine compliance_engine payment_vault \
            iot_logistics blockchain_ledger privacy_governance orchestrator \
            -ll -f txt

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          scanners: "vuln,secret,misconfig"
          skip-dirs: "venv,blockchain_ledger/fabric-samples"
